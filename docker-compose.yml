# =============================================================================
# ULPF Production Deployment Compose File
# Enforces: Production PostgreSQL 15, Mandatory Authentication, Masking & HMAC Salt
# Note: For zero-config local hackathon demo, use docker-compose.demo.yml
# =============================================================================
version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ulpf-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ulpf_user}:${POSTGRES_PASSWORD:-ulpf_secure_prod_2026}@postgres:5432/${POSTGRES_DB:-ulpf_db}
      - SECRET_KEY=${SECRET_KEY:-ulpf_prod_enterprise_jwt_signing_key_secure_2026}
      - ULPF_ADMIN_PASSWORD=${ULPF_ADMIN_PASSWORD:-AdminSecure2026!Prod}
      - REQUIRE_AUTH=true
      - ENABLE_DATA_MASKING=true
      - ULPF_SALTED_PII_SECRET=${ULPF_SALTED_PII_SECRET:-ulpf_prod_enterprise_hmac_secret_salt}
      - ULPF_ENABLE_SALTED_PSEUDONYMIZATION=true
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ulpf-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: ulpf-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ulpf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ulpf_secure_prod_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ulpf_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ulpf_user} -d ${POSTGRES_DB:-ulpf_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
